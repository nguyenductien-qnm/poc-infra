name: "CD Deploy Infrastructure & App"

on:
  push:
    branches:
      - dev
      - staging
      - main

# Đảm bảo chỉ 1 lần deploy chạy trên mỗi stack tại một thời điểm (chống xung đột State)
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write  # Xác thực AWS OIDC
  contents: read   # Đọc mã nguồn

jobs:
  deploy:
    name: "Deploy Environment"
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4

      - name: "Setup Go"
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: "Setup Docker Buildx (Hỗ trợ build container Linux AMD64)"
        uses: docker/setup-buildx-action@v3

      - name: "1. Xác định Stack và Role Deploy theo Branch"
        id: select-env
        run: |
          BRANCH="${GITHUB_REF#refs/heads/}"
          echo "Active Branch: $BRANCH"

          if [ "$BRANCH" = "main" ]; then
            echo "stack=prod" >> $GITHUB_OUTPUT
            echo "role_arn=${{ secrets.AWS_ROLE_PROD_DEPLOY }}" >> $GITHUB_OUTPUT
          elif [ "$BRANCH" = "staging" ]; then
            echo "stack=staging" >> $GITHUB_OUTPUT
            echo "role_arn=${{ secrets.AWS_ROLE_STAGING_DEPLOY }}" >> $GITHUB_OUTPUT
          else
            echo "stack=dev" >> $GITHUB_OUTPUT
            echo "role_arn=${{ secrets.AWS_ROLE_DEV_DEPLOY }}" >> $GITHUB_OUTPUT
          fi

      - name: "2. Xác thực AWS qua OIDC (Deploy Role tương ứng)"
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ steps.select-env.outputs.role_arn }}
          aws-region: "ap-southeast-1"

      - name: "3. Cài đặt Pulumi CLI"
        uses: pulumi/actions@v5

      - name: "4. Deploy Hạ tầng AWS qua Pulumi Up"
        id: pulumi-up
        working-directory: ./infra
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          pulumi login "s3://pulumi-state-poc-${ACCOUNT_ID}?region=ap-southeast-1"
          pulumi stack select ${{ steps.select-env.outputs.stack }}
          
          # Deploy ha tang tu dong
          pulumi up --yes --skip-preview

      - name: "5. Build & Push Docker Image lên AWS ECR"
        working-directory: ./infra
        run: |
          ECR_URL=$(pulumi stack output ecrRepoUrl 2>/dev/null || echo "")
          REGION="ap-southeast-1"

          if [ -n "$ECR_URL" ]; then
            echo "==> Đang đăng nhập Docker vào ECR: $ECR_URL..."
            aws ecr get-login-password --region "$REGION" | docker login --username AWS --password-stdin "$ECR_URL"

            echo "==> Đang build Docker Image từ thư mục app/..."
            docker build --platform linux/amd64 -t "$ECR_URL:latest" ../app

            echo "==> Đang đẩy Docker Image lên ECR..."
            docker push "$ECR_URL:latest"

            echo "==> Cập nhật ECS Service để nhận Image mới..."
            CLUSTER_ARN=$(pulumi stack output clusterArn 2>/dev/null || echo "")
            if [ -n "$CLUSTER_ARN" ]; then
              STACK="${{ steps.select-env.outputs.stack }}"
              aws ecs update-service \
                --cluster "$CLUSTER_ARN" \
                --service "app-svc-${STACK}" \
                --force-new-deployment \
                --region "$REGION" || echo "ECS service not ready yet, skip update."
            fi
          else
            echo "Chưa có ECR Repo, bỏ qua bước build image."
          fi

      - name: "6. Xuất thông tin sau khi Deploy hoàn tất"
        working-directory: ./infra
        run: |
          echo "=================================================="
          echo " DEPLOY THÀNH CÔNG CHO STACK: ${{ steps.select-env.outputs.stack }}"
          echo "=================================================="
          pulumi stack output
