name: "CD Deploy Infrastructure & App"

# TẠM TẮT trigger tự động trong lúc chuyển sang bootstrap/workload (chưa up bootstrap).
# Bật lại: khôi phục khối push bên dưới.
on:
  workflow_dispatch:
#  push:
#    branches:
#      - dev
#      - staging
#      - main
#    paths-ignore:
#      - "**.md"
#      - "docs/**"

# Đảm bảo chỉ 1 lần deploy chạy trên mỗi stack tại một thời điểm (chống xung đột State)
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write  # Xác thực AWS OIDC
  contents: read   # Đọc mã nguồn

env:
  AWS_REGION: "ap-southeast-1"
  # Nhánh -> stack: main -> prod, staging -> staging, dev -> dev
  STACK: ${{ github.ref_name == 'main' && 'prod' || github.ref_name }}
  # Commit SHA, dùng 7 ký tự đầu (${IMAGE_TAG::7}) làm image tag ở cả 2 job
  IMAGE_TAG: ${{ github.sha }}

jobs:
  # ----------------------------------------------------------------------------
  # Job 1: Preview bằng role read-only, in diff ra Job Summary.
  # Người duyệt xem diff ở đây TRƯỚC khi approve job deploy.
  # ----------------------------------------------------------------------------
  preview:
    name: "Preview (${{ github.ref_name == 'main' && 'prod' || github.ref_name }})"
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout Code"
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: "Setup Go"
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: infra/go.mod
          cache-dependency-path: infra/go.sum

      - name: "1. Xác thực AWS qua OIDC (Role Preview read-only)"
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ github.ref_name == 'main' && secrets.AWS_ROLE_PROD_PREVIEW || github.ref_name == 'staging' && secrets.AWS_ROLE_STAGING_PREVIEW || secrets.AWS_ROLE_DEV_PREVIEW }}
          aws-region: ${{ env.AWS_REGION }}

      - name: "2. Cài đặt Pulumi CLI"
        uses: pulumi/actions@cd99a7f8865434dd3532b586a26f9ebea596894f # v5.5.1

      - name: "3. Pulumi Preview với image tag mới"
        working-directory: ./infra/workload
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          pulumi login "s3://pulumi-state-poc-${ACCOUNT_ID}?region=${AWS_REGION}"
          pulumi stack select "$STACK"
          pulumi config set imageTag "${IMAGE_TAG::7}"

          set +e
          pulumi preview --diff > preview_output.txt 2>&1
          EXIT_CODE=$?
          set -e
          cat preview_output.txt

          {
            echo "### Pulumi Preview (\`stack: $STACK\`, image \`${IMAGE_TAG::7}\`)"
            echo '```'
            # Job Summary giới hạn 1MB, cắt bớt cho chắc
            head -c 60000 preview_output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          exit $EXIT_CODE

  # ----------------------------------------------------------------------------
  # Job 2: Deploy trong GitHub Environment (staging/prod có Required reviewers).
  # OIDC sub = <repo>:environment:<env>, trust policy do infra/bootstrap (package ciiam) quản lý.
  # ----------------------------------------------------------------------------
  deploy:
    name: "Deploy (${{ github.ref_name == 'main' && 'prod' || github.ref_name }})"
    needs: preview
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'prod' || github.ref_name }}

    steps:
      - name: "Checkout Code"
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: "Setup Go"
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: infra/go.mod
          cache-dependency-path: infra/go.sum

      - name: "Setup Docker Buildx (Hỗ trợ build container Linux AMD64)"
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: "1. Xác thực AWS qua OIDC (Role Deploy)"
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ github.ref_name == 'main' && secrets.AWS_ROLE_PROD_DEPLOY || github.ref_name == 'staging' && secrets.AWS_ROLE_STAGING_DEPLOY || secrets.AWS_ROLE_DEV_DEPLOY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: "2. Cài đặt Pulumi CLI"
        uses: pulumi/actions@cd99a7f8865434dd3532b586a26f9ebea596894f # v5.5.1

      - name: "3. Build & Push Docker Image lên Shared ECR (chỉ tag SHA)"
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          ECR_URL="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/poc-app"

          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_URL"
          docker build --platform linux/amd64 -t "$ECR_URL:${IMAGE_TAG::7}" ./app
          docker push "$ECR_URL:${IMAGE_TAG::7}"

      - name: "4. Deploy Hạ tầng AWS qua Pulumi Up"
        working-directory: ./infra/workload
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          pulumi login "s3://pulumi-state-poc-${ACCOUNT_ID}?region=${AWS_REGION}"
          pulumi stack select "$STACK"
          pulumi config set imageTag "${IMAGE_TAG::7}"
          pulumi up --yes --diff

      - name: "5. Xuất thông tin sau khi Deploy hoàn tất"
        working-directory: ./infra/workload
        run: |
          echo "DEPLOY THÀNH CÔNG CHO STACK: $STACK"
          pulumi stack output
